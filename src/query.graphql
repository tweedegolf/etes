query {
  repository(owner: "$owner", name: "$name") {
    defaultBranchRef{
      target{
        ... on Commit{
          history(first:1){
            edges{
              node{
                ... on Commit{
                  oid
                  url
                  committedDate
                  messageHeadline
                }
              }
            }
          }
        }
      }
    }
    $branches
    releases(
      first: 1
      orderBy: {field: CREATED_AT, direction: DESC}
    ) {
      edges {
        node {
          name
          url
          tagName
          createdAt
          tagCommit {
          	oid
            authoredDate
          }
        }
      }
    }
    pullRequests(
      last: 50
      orderBy: {field: CREATED_AT, direction: DESC}
      states: OPEN
    ) {
      edges {
        node {
          number
          title
          isDraft
          assignees(first: 10) {
            edges {
              node {
                name
                login
                avatarUrl
              }
            }
          }
          createdAt
          statusCheckRollup {
            state
            commit {
              oid
              authoredDate
            }
          }
        }
      }
    }
  }
}
